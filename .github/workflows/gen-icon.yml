name: Generate StreamVerse icon

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gen-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Draw the StreamVerse icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter

          S = 2048   # supersampled canvas for smooth anti-aliasing
          OUT = 512  # final icon size

          img = Image.new("RGBA", (S, S), (0, 0, 0, 0))

          # Vertical gradient: deep indigo -> vivid violet
          top, bot = (45, 22, 120), (139, 92, 246)
          grad = Image.new("RGBA", (S, S))
          gd = ImageDraw.Draw(grad)
          for y in range(S):
              t = y / (S - 1)
              gd.line(
                  [(0, y), (S, y)],
                  fill=(
                      int(top[0] + (bot[0] - top[0]) * t),
                      int(top[1] + (bot[1] - top[1]) * t),
                      int(top[2] + (bot[2] - top[2]) * t),
                      255,
                  ),
              )

          # Soft light bloom in the upper-left corner
          hl = Image.new("L", (S, S), 0)
          ImageDraw.Draw(hl).ellipse(
              (-int(S * 0.55), -int(S * 0.6), int(S * 0.85), int(S * 0.5)), fill=90
          )
          hl = hl.filter(ImageFilter.GaussianBlur(200))
          grad.paste((255, 255, 255), (0, 0), hl)

          # Rounded-square silhouette
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, S - 1, S - 1), radius=440, fill=255)
          img.paste(grad, (0, 0), mask)

          # Orbit arcs behind the play button ("verse" rings)
          arcs = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          ad = ImageDraw.Draw(arcs)
          ad.arc(
              (int(S * 0.10), int(S * 0.10), int(S * 0.90), int(S * 0.90)),
              start=195, end=345,
              fill=(255, 255, 255, 120),
              width=int(S * 0.045),
          )
          ad.arc(
              (int(S * 0.19), int(S * 0.19), int(S * 0.81), int(S * 0.81)),
              start=15, end=125,
              fill=(255, 255, 255, 80),
              width=int(S * 0.03),
          )
          img.alpha_composite(arcs)

          # Centered play triangle, nudged right for optical balance
          tri = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          td = ImageDraw.Draw(tri)
          cx, cy = S * 0.52, S * 0.5
          w, h = S * 0.26, S * 0.34
          td.polygon(
              [(cx - w * 0.45, cy - h / 2), (cx - w * 0.45, cy + h / 2), (cx + w * 0.68, cy)],
              fill=(255, 255, 255, 242),
          )
          img.alpha_composite(tri)

          img = img.resize((OUT, OUT), Image.LANCZOS)
          img.save("StreamVerse/icon.png")
          print("saved StreamVerse/icon.png", img.size)
          PY

      - name: Verify the icon
        run: python3 -c "from PIL import Image; im=Image.open('StreamVerse/icon.png'); assert im.size==(512,512); assert im.mode=='RGBA'; assert im.getbbox() is not None; print('icon ok', im.size, im.mode)"

      - name: Commit the icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StreamVerse/icon.png
          if git diff --cached --quiet; then
            echo "Icon already up to date"
          else
            git commit -m "StreamVerse: add generated icon"
            git push
          fi
