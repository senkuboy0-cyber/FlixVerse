name: Patch Gradle Authors

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  patch-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlixVerse
        uses: actions/checkout@v4

      - name: Patch build.gradle.kts
        run: |
          FILE="MlsbdProvider/build.gradle.kts"
          sed -i 's/authors = listOf("Your Name")/authors = listOf("senkuboy0-cyber")/g' "$FILE"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Update authors to senkuboy0-cyber" || echo "No changes"
          git push