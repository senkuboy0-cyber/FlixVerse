name: Fetch MlsbdProvider

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  copy-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlixVerse
        uses: actions/checkout@v4

      - name: Fetch MlsbdProvider
        run: |
          git clone --depth 1 https://github.com/cosmix-extensions/Free.git temp_repo
          cp -r temp_repo/MlsbdProvider ./
          rm -rf temp_repo
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MlsbdProvider
          git commit -m "Add MlsbdProvider from cosmix-extensions/Free" || echo "No changes"
          git push