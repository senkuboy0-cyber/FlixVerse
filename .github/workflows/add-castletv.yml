name: Add CastleTV and Build

# Manual run only: Actions -> "Add CastleTV and Build" -> Run workflow.
# One run does everything:
#   1. copies CastleTvProvider from the CNCVerse repo
#   2. changes authors + iconUrl in its build.gradle.kts
#   3. renames package com.cncverse -> com.castletv (folder, .kt files, manifest)
#   4. adds the module to settings.gradle.kts and build.yml
#   5. builds all .cs3 files and deploys them to the builds branch
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/Xitizeofficial/CNCVerse-Cloud-Stream-Extension.git
  MODULE: CastleTvProvider
  OLD_PKG: cncverse
  NEW_PKG: castletv
  # Optional secret: a personal access token with "workflow" scope.
  # Needed only to let this job edit .github/workflows/build.yml.
  WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}

jobs:
  add-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 1. Copy the module from the source repo
      # ---------------------------------------------------------------
      - name: Copy CastleTvProvider from source repo
        run: |
          git clone --depth 1 "$SOURCE_REPO" /tmp/source
          if [ ! -d "/tmp/source/$MODULE" ]; then
            echo "::error::$MODULE folder not found in source repo"
            exit 1
          fi
          rm -rf "$MODULE"
          cp -r "/tmp/source/$MODULE" "./$MODULE"
          rm -rf "$MODULE/build" "$MODULE/.git"
          echo "Copied $MODULE:"
          find "$MODULE" -type f | sort

      # ---------------------------------------------------------------
      # 2. Change authors and iconUrl in the module's build.gradle.kts
      # ---------------------------------------------------------------
      - name: Update authors and iconUrl
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
          AUTHOR: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          p = pathlib.Path(os.environ["MODULE"]) / "build.gradle.kts"
          s = p.read_text()
          icon = "https://raw.githubusercontent.com/{}/refs/heads/{}/{}/icon.png".format(
              os.environ["REPO"], os.environ["BRANCH"], os.environ["MODULE"])
          s, n1 = re.subn(r'authors\s*=\s*listOf\([^)]*\)',
                          'authors = listOf("{}")'.format(os.environ["AUTHOR"]), s)
          s, n2 = re.subn(r'iconUrl\s*=\s*"[^"]*"', 'iconUrl = "{}"'.format(icon), s)
          print("authors replaced:", n1, "| iconUrl replaced:", n2)
          if n1 == 0 or n2 == 0:
              raise SystemExit("authors/iconUrl line not found in build.gradle.kts")
          p.write_text(s)
          PY
          echo "----- $MODULE/build.gradle.kts -----"
          cat "$MODULE/build.gradle.kts"

      # ---------------------------------------------------------------
      # 3. Rename package com.cncverse -> com.castletv
      # ---------------------------------------------------------------
      - name: Rename package
        run: |
          KT="$MODULE/src/main/kotlin"
          # folder: com/cncverse -> com/castletv
          if [ -d "$KT/com/$OLD_PKG" ]; then
            mv "$KT/com/$OLD_PKG" "$KT/com/$NEW_PKG"
          fi
          # package / import / fully-qualified references + manifest
          grep -rIl "com\.$OLD_PKG" "$MODULE/src" | while read -r f; do
            sed -i "s/com\.$OLD_PKG/com.$NEW_PKG/g" "$f"
          done
          echo "Package declarations now:"
          grep -rn "^package " "$KT" || true
          echo "Manifest:"
          cat "$MODULE/src/main/AndroidManifest.xml"
          echo "Leftover '$OLD_PKG' mentions (informational):"
          grep -rIni "$OLD_PKG" "$MODULE" || echo "none"

      # ---------------------------------------------------------------
      # 4. Register the module in settings.gradle.kts and build.yml
      # ---------------------------------------------------------------
      - name: Add module to settings.gradle.kts and build.yml
        run: |
          if ! grep -q "include(\"$MODULE\")" settings.gradle.kts; then
            printf '\ninclude("%s")\n' "$MODULE" >> settings.gradle.kts
          fi
          echo "----- settings.gradle.kts -----"
          cat settings.gradle.kts

          python3 - <<'PY'
          import os, pathlib
          m = os.environ["MODULE"]
          p = pathlib.Path(".github/workflows/build.yml")
          s = p.read_text()
          if m in s:
              print("build.yml already contains", m)
          else:
              s = s.replace("./gradlew MlsbdProvider:make\n",
                            "./gradlew MlsbdProvider:make\n          ./gradlew " + m + ":make\n", 1)
              s = s.replace("cp MlsbdProvider/build/MlsbdProvider.cs3 build/\n",
                            "cp MlsbdProvider/build/MlsbdProvider.cs3 build/\n          cp " + m + "/build/" + m + ".cs3 build/\n", 1)
              p.write_text(s)
              print("build.yml updated")
          PY

      # ---------------------------------------------------------------
      # Commit. A push made with GITHUB_TOKEN never starts another
      # workflow run, so the build below is the only run.
      # ---------------------------------------------------------------
      - name: Commit module and settings.gradle.kts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODULE" settings.gradle.kts
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add $MODULE (package com.$NEW_PKG)"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Commit build.yml (only if WORKFLOW_PAT secret exists)
        if: env.WORKFLOW_PAT != ''
        run: |
          git add .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "build.yml unchanged"
          else
            # [skip ci] keeps this push from starting a second build
            git commit -m "Add $MODULE to build.yml [skip ci]"
            git push "https://x-access-token:${WORKFLOW_PAT}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"
          fi

      - name: Note about build.yml (no WORKFLOW_PAT secret)
        if: env.WORKFLOW_PAT == ''
        run: |
          echo "::warning::GITHUB_TOKEN cannot modify files under .github/workflows, so build.yml was NOT updated in the repo. Add a WORKFLOW_PAT secret (token with 'workflow' scope) or add the $MODULE lines to build.yml by hand."
          git checkout -- .github/workflows/build.yml

      # ---------------------------------------------------------------
      # 5. Build every module and deploy to the builds branch
      # ---------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and Generate
        run: |
          ./gradlew MlsbdProvider:make
          ./gradlew ${MODULE}:make
          ./gradlew makePluginsJson
          mkdir -p build
          cp MlsbdProvider/build/MlsbdProvider.cs3 build/
          cp ${MODULE}/build/${MODULE}.cs3 build/
          echo '{
            "name": "FlixVerse",
            "description": "Your ultimate CloudStream repository for unlimited movies, TV series, and cinematic content from around the web.",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/senkuboy0-cyber/FlixVerse/refs/heads/builds/plugins.json"
            ]
          }' > build/repo.json
          ls -la build

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: false
          token: ${{ secrets.GITHUB_TOKEN }}
